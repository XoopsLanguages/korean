<div class="outer" id="help-template">
<h1 class="head">도움말: 사용자에게 이메일 보내기</h1>
<h4 class="odd">설명</h4>
<p class="even">
        XOOPS에는 등록된 전체 사용자 기반이나 하위 그룹에 또는 날짜 필터를 사용하여 메시지를 보낼 수 있는 내장 메시징 시스템이 있습니다. 이는 개인 메시지(예: XOOPS 내장 메시징 시스템을 통해) 또는 이메일 형식일 수 있습니다. 다양한 옵션은
        멤버십에서 사용자의 하위 그룹을 필터링하는 데 사용할 수 있습니다.<br/><br/>

        메시지를 개인화할 수 있도록 미리 정의된 태그를 사용할 수도 있습니다.
    </p>
</div>
