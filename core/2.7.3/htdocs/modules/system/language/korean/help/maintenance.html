<h1 class="head">도움말: 유지 관리</h1>
<h4 class="odd">설명</h4>
<p class="even">
        유지 관리는 XOOPS 설치를 유지 관리하고 건강하게 유지하는 데 도움이 되는 몇 가지 기본 기능을 제공합니다.<br/><br/>

        - 캐시 폴더 정리<br/>
        - 세션 테이블을 비웁니다.<br/>
        - 데이터베이스 테이블 유지 관리 수행(분석, 확인, 최적화 및 복구) <br/><br/>

        백업 목적으로 전체 데이터베이스 또는 개별 테이블의 "덤프"를 수행할 수도 있습니다. </p>
